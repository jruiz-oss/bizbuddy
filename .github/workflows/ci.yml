name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (informational — pre-existing errors expected)
        run: npm run check || true

      - name: Build server
        run: npm run build:server
        env:
          NODE_ENV: production

      - name: Build client
        run: npm run build:client
        env:
          NODE_ENV: production
          # Placeholder — real value set on Vercel
          VITE_API_URL: https://placeholder.railway.app
